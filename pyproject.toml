[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piframe"
version = "0.1.0"
description = "A photo frame application serving random photos from Google Drive"
requires-python = ">=3.8"

[tool.autopep8]
max_line_length = 88
aggressive = 2
recursive = true
ignore = ["E203", "W503"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501", "F401", "F403", "F405"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".env",
    ".vscode",
    "*.egg-info",
    "build",
    "dist"
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true 