<!doctype html>
<html>

<head>
    <title>Photo frame</title>
    <style>
        .fullScreenPhoto {
            max-width: 100%;
            max-height: 100%;
            bottom: 0;
            left: 0;
            margin: auto;
            overflow: auto;
            position: fixed;
            right: 0;
            top: 0;
            -o-object-fit: contain;
            object-fit: contain;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        .infoFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: relative;
            z-index: 10;
            display: inline-block;
        }

        .weatherFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            bottom: 0%;
        }

        .forecastFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            right: 0%;
            top: 0%;
            width: 25%;
            max-width: 450px;
        }

        .metadataFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            top: 0%;
            font-size: 0.9em;
        }

        h1 {
            margin: 0px;
            padding: 0px;
        }

        .metadata-item {
            margin: 2px 0;
        }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
        function updateImageAndMetadata() {
            fetch('/random-picture/metadata')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Update image source
                    var img = document.querySelector('.fullScreenPhoto');
                    if (img) {
                        img.src = data.picture_url;
                    }

                    // Update metadata
                    var creationDateEl = document.getElementById('creation-date');
                    var creationTimeEl = document.getElementById('creation-time');
                    var cameraInfoEl = document.getElementById('camera-info');
                    var dimensionsEl = document.getElementById('dimensions');

                    if (creationDateEl) creationDateEl.innerText = data.creation_date || 'Unknown';
                    if (creationTimeEl) creationTimeEl.innerText = data.creation_time || 'Unknown';
                    if (cameraInfoEl) cameraInfoEl.innerText = data.camera_info || 'Unknown';
                    if (dimensionsEl) dimensionsEl.innerText = data.dimensions || 'Unknown';

                    // Show metadata frame
                    var metadataFrame = document.querySelector('.metadataFrame');
                    if (metadataFrame) {
                        metadataFrame.style.display = 'inline-block';
                    }
                })
                .catch(error => {
                    console.error('Error fetching new image and metadata:', error);
                    // Hide metadata frame on error
                    var metadataFrame = document.querySelector('.metadataFrame');
                    if (metadataFrame) {
                        metadataFrame.style.display = 'none';
                    }
                });
        }

        window.onload = function () {
            updateImageAndMetadata();
            // Refresh every 30 seconds
            setInterval(updateImageAndMetadata, 30000);
        };
    </script>
</head>

<body>
    <img src="" class="fullScreenPhoto" alt="Random photo" />
    <div class="infoFrame">
        <h1 id="creation-date"></h1>
        <span id="creation-time"></span><br />
        <h1>{{ temperature }}°C</h1>
        FL {{ feels_like }}°C / {{ weather_type }}
    </div>
    <div class="weatherFrame">
        <table>
            <tbody>
                <tr>
                    {% for f1 in forecast %}
                    <td style="text-align: center">
                        {{ f1['time'] }}<br />
                        <img src="{{ f1['icon'] }}" alt="{{ f1['weather'] }}" width="60%" /><br />
                        {{ f1['temp'] }}°C<br />
                        FL&nbsp;{{ f1['feels_like'] }}°C
                    </td>
                    {% endfor %}
                </tr>
            </tbody>
        </table>
    </div>
    <div class="forecastFrame">
        <img src="/weather/forecast.png" alt="forecast trendline" style="width: 100%" />
    </div>

    <div class="metadataFrame" style="display: none;">
        <div class="metadata-item">
            <strong>Date:</strong> <span id="creation-date">Loading...</span>
        </div>
        <div class="metadata-item">
            <strong>Time:</strong> <span id="creation-time">Loading...</span>
        </div>
        <div class="metadata-item">
            <strong>Camera:</strong> <span id="camera-info">Loading...</span>
        </div>
        <div class="metadata-item">
            <strong>Dimensions:</strong> <span id="dimensions">Loading...</span>
        </div>
    </div>

</body>

</html>
