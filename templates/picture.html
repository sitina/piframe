<!doctype html>
<html>

<head>
    <title>Photo frame</title>
    <style>
        .fullScreenPhoto {
            max-width: 100%;
            max-height: 100%;
            bottom: 0;
            left: 0;
            margin: auto;
            overflow: auto;
            position: fixed;
            right: 0;
            top: 0;
            -o-object-fit: contain;
            object-fit: contain;
        }

        .loading-placeholder {
            display: block;
            font-size: 4rem;
            color: #fff;
            text-align: center;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 50%;
            left: 0;
            margin-top: -2rem;
            background-color: #000;
        }

        .loading-placeholder.hidden {
            display: none;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        .infoFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: relative;
            z-index: 10;
            display: inline-block;
        }

        .weatherFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            bottom: 0%;
        }

        .forecastFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            right: 0%;
            top: 0%;
            width: 25%;
            max-width: 450px;
        }

        .metadataFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            top: 0%;
            font-size: 0.9em;
        }

        h1 {
            margin: 0px;
            padding: 0px;
        }

        .metadata-item {
            margin: 2px 0;
        }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="/static/js/frame.js" defer></script>
</head>

<body data-refresh-ms="{{ refresh_interval * 1000 }}">
    <!-- Loading placeholder with emoji -->
    <div class="loading-placeholder">
        <div>
            📸<br>
            <div style="font-size: 1.5rem; margin-top: 1rem;">Loading image...</div>
        </div>
    </div>
    
    <!-- Main image (initially hidden) -->
    <img id="frame-photo" class="fullScreenPhoto" alt="Random photo" style="display: none;" />
    <div class="infoFrame">
        <h1 id="creation-date"></h1>
        <span id="creation-time"></span><br />
    </div>
    <div id="photo-status" role="status"></div>
    <div id="weather-overlay">{% include '_weather_overlay.html' %}</div>

</body>

</html>
