<!doctype html>
<html>

<head>
    <title>Photo frame</title>
    <style>
        .fullScreenPhoto {
            max-width: 100%;
            max-height: 100%;
            bottom: 0;
            left: 0;
            margin: auto;
            overflow: auto;
            position: fixed;
            right: 0;
            top: 0;
            -o-object-fit: contain;
            object-fit: contain;
        }

        .loading-placeholder {
            display: block;
            font-size: 4rem;
            color: #fff;
            text-align: center;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 50%;
            left: 0;
            margin-top: -2rem;
            background-color: #000;
        }

        .loading-placeholder.hidden {
            display: none;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        .infoFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: relative;
            z-index: 10;
            display: inline-block;
        }

        .weatherFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            bottom: 0%;
        }

        .forecastFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            right: 0%;
            top: 0%;
            width: 25%;
            max-width: 450px;
        }

        .metadataFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            top: 0%;
            font-size: 0.9em;
        }

        h1 {
            margin: 0px;
            padding: 0px;
        }

        .metadata-item {
            margin: 2px 0;
        }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
        var retryCount = 0;
        var MAX_RETRIES = 3;
        var RETRY_DELAY = 2000;
        var LOADING_TIMEOUT = 15000;
        var currentImageHash = null;
        var isLoading = false;
        var loadingTimeout = null;

        function showLoadingIndicator() {
            var metadataFrame = document.querySelector('.metadataFrame');
            if (metadataFrame) {
                metadataFrame.style.display = 'inline-block';
                metadataFrame.innerHTML = '<div class="metadata-item">Loading new image...</div>';
            }
            
            var loadingPlaceholder = document.querySelector('.loading-placeholder');
            var mainImage = document.querySelector('.fullScreenPhoto');
            
            if (loadingPlaceholder) {
                loadingPlaceholder.className = loadingPlaceholder.className.replace('hidden', '');
            }
            if (mainImage) {
                mainImage.style.display = 'none';
            }
        }

        function hideLoadingIndicator() {
            var metadataFrame = document.querySelector('.metadataFrame');
            if (metadataFrame) {
                metadataFrame.innerHTML = '<div class="metadata-item"><strong>Date:</strong> <span id="creation-date">Loading...</span></div><div class="metadata-item"><strong>Time:</strong> <span id="creation-time">Loading...</span></div>';
            }
            
            var loadingPlaceholder = document.querySelector('.loading-placeholder');
            var mainImage = document.querySelector('.fullScreenPhoto');
            
            if (loadingPlaceholder) {
                if (loadingPlaceholder.className.indexOf('hidden') === -1) {
                    loadingPlaceholder.className += ' hidden';
                }
            }
            if (mainImage) {
                mainImage.style.display = 'block';
            }
        }

        function updateMetadataElements(data) {
            try {
                var creationDateEl = document.getElementById('creation-date');
                var creationTimeEl = document.getElementById('creation-time');
                if (creationDateEl) creationDateEl.innerText = data.creation_date || 'Unknown';
                if (creationTimeEl) creationTimeEl.innerText = data.creation_time || 'Unknown';
                return true;
            } catch (error) {
                return false;
            }
        }

        function finalizeImageUpdate(data) {
            try {
                updateMetadataElements(data);
                var metadataFrame = document.querySelector('.metadataFrame');
                if (metadataFrame) {
                    metadataFrame.style.display = 'inline-block';
                }
                return true;
            } catch (error) {
                return false;
            }
        }

        function resetLoadingAndHandle(success, data) {
            try {
                if (loadingTimeout) {
                    clearTimeout(loadingTimeout);
                    loadingTimeout = null;
                }
                isLoading = false;
                if (success) {
                    retryCount = 0;
                } else {
                    handleUpdateFailure();
                }
            } catch (error) {
                isLoading = false;
                handleUpdateFailure();
            }
        }

        function updateImageAndMetadata(attempt) {
            if (typeof attempt === 'undefined') attempt = 0;
            
            if (isLoading && attempt === 0) {
                return;
            }

            isLoading = true;
            if (attempt === 0) {
                showLoadingIndicator();
                loadingTimeout = setTimeout(function() {
                    resetLoadingAndHandle(false);
                }, LOADING_TIMEOUT);
            }

            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/random-picture/metadata?t=' + new Date().getTime(), true);
            xhr.setRequestHeader('Cache-Control', 'no-cache');
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            
                            var img = document.querySelector('.fullScreenPhoto');
                            if (img && data.picture_url) {
                                img.onload = function() {
                                    hideLoadingIndicator();
                                };
                                
                                img.onerror = function() {
                                    // Keep loading indicator visible on error
                                };
                                
                                img.src = data.picture_url;
                                currentImageHash = data.image_hash;
                            }

                            var success = finalizeImageUpdate(data);
                            resetLoadingAndHandle(success, data);
                        } catch (error) {
                            resetLoadingAndHandle(false);
                        }
                    } else {
                        resetLoadingAndHandle(false);
                    }
                }
            };
            
            xhr.send();
        }

        function handleUpdateFailure() {
            if (retryCount < MAX_RETRIES) {
                retryCount++;
                setTimeout(function() {
                    updateImageAndMetadata(retryCount);
                }, RETRY_DELAY);
            } else {
                try {
                    var metadataFrame = document.querySelector('.metadataFrame');
                    if (metadataFrame) {
                        metadataFrame.style.display = 'none';
                    }
                } catch (error) {
                    // Ignore error
                }
            }
        }

        window.onload = function() {
            updateImageAndMetadata();
            setInterval(function() {
                updateImageAndMetadata();
            }, 30000);
        };
    </script>
</head>

<body>
    <!-- Loading placeholder with emoji -->
    <div class="loading-placeholder">
        <div>
            📸<br>
            <div style="font-size: 1.5rem; margin-top: 1rem;">Loading image...</div>
        </div>
    </div>
    
    <!-- Main image (initially hidden) -->
    <img src="" class="fullScreenPhoto" alt="Random photo" style="display: none;" />
    <div class="infoFrame">
        <h1 id="creation-date"></h1>
        <span id="creation-time"></span><br />
        <h1>{{ temperature }}°C</h1>
        FL {{ feels_like }}°C / {{ weather_type }}
    </div>
    <div class="weatherFrame">
        <table>
            <tbody>
                <tr>
                    {% for f1 in forecast %}
                    <td style="text-align: center">
                        {{ f1['time'] }}<br />
                        <img src="{{ f1['icon'] }}" alt="{{ f1['weather'] }}" width="60%" /><br />
                        {{ f1['temp'] }}°C<br />
                        FL&nbsp;{{ f1['feels_like'] }}°C
                    </td>
                    {% endfor %}
                </tr>
            </tbody>
        </table>
    </div>
    <div class="forecastFrame">
        <img src="/weather/forecast.png" alt="forecast trendline" style="width: 100%" />
    </div>

</body>

</html>
