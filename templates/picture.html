<!doctype html>
<html>

<head>
    <title>Photo frame</title>
    <style>
        .fullScreenPhoto {
            max-width: 100%;
            max-height: 100%;
            bottom: 0;
            left: 0;
            margin: auto;
            overflow: auto;
            position: fixed;
            right: 0;
            top: 0;
            -o-object-fit: contain;
            object-fit: contain;
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #fff;
            text-align: center;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000;
        }

        .loading-placeholder.hidden {
            display: none;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        .infoFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: relative;
            z-index: 10;
            display: inline-block;
        }

        .weatherFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            bottom: 0%;
        }

        .forecastFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            right: 0%;
            top: 0%;
            width: 25%;
            max-width: 450px;
        }

        .metadataFrame {
            margin: 5px;
            padding: 10px;
            background: rgba(175, 175, 175, 0.3);
            color: #fff;
            position: absolute;
            z-index: 10;
            display: inline-block;
            left: 0%;
            top: 0%;
            font-size: 0.9em;
        }

        h1 {
            margin: 0px;
            padding: 0px;
        }

        .metadata-item {
            margin: 2px 0;
        }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
        let retryCount = 0;
        const MAX_RETRIES = 3;
        const RETRY_DELAY = 2000; // 2 seconds
        const LOADING_TIMEOUT = 15000; // 15 seconds timeout
        let currentImageHash = null;
        let isLoading = false;
        let loadingTimeout = null;

        function showLoadingIndicator() {
            var metadataFrame = document.querySelector('.metadataFrame');
            if (metadataFrame) {
                metadataFrame.style.display = 'inline-block';
                metadataFrame.innerHTML = '<div class="metadata-item">Loading new image...</div>';
            }
            
            // Show loading placeholder and hide main image
            var loadingPlaceholder = document.querySelector('.loading-placeholder');
            var mainImage = document.querySelector('.fullScreenPhoto');
            
            if (loadingPlaceholder) {
                loadingPlaceholder.classList.remove('hidden');
            }
            if (mainImage) {
                mainImage.style.display = 'none';
            }
        }

        function hideLoadingIndicator() {
            var metadataFrame = document.querySelector('.metadataFrame');
            if (metadataFrame) {
                // Restore original content
                metadataFrame.innerHTML = `
                    <div class="metadata-item">
                        <strong>Date:</strong> <span id="creation-date">Loading...</span>
                    </div>
                    <div class="metadata-item">
                        <strong>Time:</strong> <span id="creation-time">Loading...</span>
                    </div>
                `;
            }
            
            // Hide loading placeholder and show main image
            var loadingPlaceholder = document.querySelector('.loading-placeholder');
            var mainImage = document.querySelector('.fullScreenPhoto');
            
            if (loadingPlaceholder) {
                loadingPlaceholder.classList.add('hidden');
            }
            if (mainImage) {
                mainImage.style.display = 'block';
            }
        }

        function verifyImageMetadataSync(data, imageResponse) {
            // Verify that image hash matches metadata hash (non-blocking)
            if (data.image_hash && imageResponse) {
                const imageHash = imageResponse.headers.get('X-Image-Hash');
                if (imageHash && imageHash !== data.image_hash) {
                    console.warn('Image hash mismatch detected (continuing anyway):', {
                        metadata_hash: data.image_hash,
                        image_hash: imageHash
                    });
                    // Return true anyway - don't block on hash mismatch
                }
            }
            return true; // Always return true to avoid blocking
        }

        function updateMetadataElements(data) {
            // Safely update metadata elements with null checks
            try {
                const creationDateEl = document.getElementById('creation-date');
                const creationTimeEl = document.getElementById('creation-time');
                if (creationDateEl) creationDateEl.innerText = data.creation_date || 'Unknown';
                if (creationTimeEl) creationTimeEl.innerText = data.creation_time || 'Unknown';

                console.log('Successfully updated metadata elements');
                return true;
            } catch (error) {
                console.error('Error updating metadata elements:', error);
                return false;
            }
        }

        function finalizeImageUpdate(data) {
            // Final step: update metadata and show frame (loading indicator will be hidden when image loads)
            try {
                // Update metadata elements (loading indicator will be hidden when image loads)
                updateMetadataElements(data);

                // Show metadata frame
                const metadataFrame = document.querySelector('.metadataFrame');
                if (metadataFrame) {
                    metadataFrame.style.display = 'inline-block';
                }

                console.log('Successfully finalized image update');
                return true;
            } catch (error) {
                console.error('Error finalizing image update:', error);
                return false;
            }
        }

        function updateImageAndMetadata(attempt = 0) {
            if (isLoading && attempt === 0) {
                console.log('Update already in progress, skipping');
                return;
            }

            // Set loading state and show indicator
            isLoading = true;
            if (attempt === 0) {
                showLoadingIndicator();

                // Set timeout to prevent getting stuck
                loadingTimeout = setTimeout(() => {
                    console.error('Loading timeout reached, forcing reset');
                    resetLoadingAndHandle(false);
                }, LOADING_TIMEOUT);
            }

            console.log(`Updating image and metadata (attempt ${attempt + 1}/${MAX_RETRIES + 1})`);

            // Wrapper to ensure isLoading is always reset
            const resetLoadingAndHandle = (success, data = null) => {
                try {
                    // Clear loading timeout
                    if (loadingTimeout) {
                        clearTimeout(loadingTimeout);
                        loadingTimeout = null;
                    }

                    isLoading = false;

                    if (success) {
                        retryCount = 0;
                        console.log('Successfully updated image and metadata');
                    } else {
                        handleUpdateFailure(attempt);
                    }
                } catch (error) {
                    console.error('Error in resetLoadingAndHandle:', error);
                    isLoading = false;
                    handleUpdateFailure(attempt);
                }
            };

            // Main update logic with comprehensive error handling
            fetch('/random-picture/metadata', {
                cache: 'no-cache',
                headers: {
                    'Cache-Control': 'no-cache'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Metadata fetch failed: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Metadata received:', data);

                    // Update image source first
                    const img = document.querySelector('.fullScreenPhoto');
                    if (img && data.picture_url) {
                        // Set up image load event to hide loading indicator when image loads
                        img.onload = function() {
                            console.log('Image loaded successfully');
                            hideLoadingIndicator();
                        };
                        
                        img.onerror = function() {
                            console.error('Image failed to load');
                            // Keep loading indicator visible on error
                        };
                        
                        img.src = data.picture_url;
                        currentImageHash = data.image_hash;
                        console.log('Updated image source:', data.picture_url);
                    } else {
                        throw new Error('Invalid image data or missing image element');
                    }

                    // Finalize the update (update metadata, show frame) - loading indicator will be hidden when image loads
                    const success = finalizeImageUpdate(data);
                    resetLoadingAndHandle(success, data);
                })
                .catch(error => {
                    console.error('Error in updateImageAndMetadata:', error);
                    resetLoadingAndHandle(false);
                });
        }

        function handleUpdateFailure(attempt) {
            if (attempt < MAX_RETRIES) {
                console.log(`Retrying in ${RETRY_DELAY}ms... (${attempt + 1}/${MAX_RETRIES})`);
                setTimeout(() => {
                    updateImageAndMetadata(attempt + 1);
                }, RETRY_DELAY);
            } else {
                console.error('Max retries reached, giving up');
                // Hide loading indicator and metadata frame on final failure
                try {
                    const metadataFrame = document.querySelector('.metadataFrame');
                    if (metadataFrame) {
                        metadataFrame.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Error hiding metadata frame:', error);
                }
            }
        }

        window.onload = function () {
            updateImageAndMetadata();
            // Refresh every 30 seconds
            setInterval(updateImageAndMetadata, 30000);
        };
    </script>
</head>

<body>
    <!-- Loading placeholder with emoji -->
    <div class="loading-placeholder">
        <div>
            📸<br>
            <div style="font-size: 1.5rem; margin-top: 1rem;">Loading image...</div>
        </div>
    </div>
    
    <!-- Main image (initially hidden) -->
    <img src="" class="fullScreenPhoto" alt="Random photo" style="display: none;" />
    <div class="infoFrame">
        <h1 id="creation-date"></h1>
        <span id="creation-time"></span><br />
        <h1>{{ temperature }}°C</h1>
        FL {{ feels_like }}°C / {{ weather_type }}
    </div>
    <div class="weatherFrame">
        <table>
            <tbody>
                <tr>
                    {% for f1 in forecast %}
                    <td style="text-align: center">
                        {{ f1['time'] }}<br />
                        <img src="{{ f1['icon'] }}" alt="{{ f1['weather'] }}" width="60%" /><br />
                        {{ f1['temp'] }}°C<br />
                        FL&nbsp;{{ f1['feels_like'] }}°C
                    </td>
                    {% endfor %}
                </tr>
            </tbody>
        </table>
    </div>
    <div class="forecastFrame">
        <img src="/weather/forecast.png" alt="forecast trendline" style="width: 100%" />
    </div>

</body>

</html>
